    <body>
        <div id="mapa-escuela"></div>
        <script>
            var map;
            // Init Open Street Maps
            function crearMapa(latitud,longitud) {
                // set up the map
                map = new L.Map('mapa-escuela');
                var osmUrl='../../%7bs%7d.tile.openstreetmap.org/%7bz%7d/%7bx%7d/%7by%7d.png';
                var osmAttrib='Map data © <a href="https://openstreetmap.org/">OpenStreetMap</a> contributors';
                var osm = new L.TileLayer(osmUrl, {minZoom: 2, maxZoom: 19, attribution: osmAttrib});
                map.setView(new L.LatLng(latitud, longitud),15);
                map.addLayer(osm);

                var marker = L.marker([latitud, longitud]).addTo(map);
                // marker.bindPopup("<b>Botanischer Garten</b><br>is here").openPopup();
            }

            window.addEventListener('message', event => {
                resultado = eval(event.data);
            });
        </script>
    </body>
